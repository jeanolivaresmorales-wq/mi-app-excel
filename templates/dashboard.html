<!DOCTYPE html>
<html>
<head>
    <title>Panel de control</title>
    <!-- Estilos y scripts de ag-Grid -->
    <link rel="stylesheet" href="https://unpkg.com/ag-grid-community@31.3.2/styles/ag-grid.css">
    <link rel="stylesheet" href="https://unpkg.com/ag-grid-community@31.3.2/styles/ag-theme-alpine.css">
    <script src="https://unpkg.com/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
    <style>
        body { font-family: Arial; margin: 20px; }
        .acciones { margin: 20px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        button { padding: 10px; margin-right: 10px; }
        .pestanas { margin-bottom: 20px; }
        .pestana { display: inline-block; padding: 10px; background: #ddd; cursor: pointer; margin-right: 5px; }
        .pestana.activa { background: #007bff; color: white; }
        #gridContainer {
            height: 600px;
            width: 100%;
        }
        .status { margin-left: 20px; font-weight: bold; }
        .loading {
            display: none;
            margin-left: 20px;
            color: #007bff;
            font-weight: bold;
        }
        .last-upload {
            margin-left: 20px;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>
    <h2>Bienvenido, {{ usuario }}</h2>
    <div class="acciones">
        <button id="btnExportar">📥 Exportar Excel</button>
        <button id="btnSubir" {% if usuario != admin %}disabled{% endif %}>📂 Subir Excel nuevo (solo admin)</button>
        <button id="btnPausa" {% if usuario != admin %}disabled{% endif %}>⏸️ Pausar / Reanudar</button>
        <span id="estadoPausa" class="status"></span>
        <span id="loadingMessage" class="loading">⏳ Procesando archivo, por favor espera...</span>
        <span id="lastUpload" class="last-upload"></span>
        <a href="/logout" style="margin-left: 20px;">Cerrar sesión</a>
    </div>
    <div class="pestanas">
        <div id="pestana_SCD" class="pestana" data-hoja="SCD-2026">SCD-2026</div>
        <div id="pestana_SAF" class="pestana" data-hoja="SAF-2026">SAF-2026</div>
    </div>
    <div id="gridContainer" class="ag-theme-alpine"></div>

    <script>
        // --- Configuración global ---
        let hojaActual = 'SCD-2026';
        let gridApi = null;
        let gridColumnApi = null;
        let rowData = [];

        // --- Funciones para cargar y guardar ---
        async function cargarDatos() {
            const res = await fetch(`/get_datos?hoja=${hojaActual}`);
            const json = await res.json();
            rowData = json.datos || [];
            if (rowData.length === 0) {
                gridApi.setRowData([]);
                return;
            }
            const columnas = json.columnas || [];
            const colDefs = columnas
                .filter(col => col !== 'rowid')
                .map(col => ({
                    field: col,
                    headerName: col,
                    editable: true,
                    sortable: true,
                    filter: true,
                    resizable: true,
                    minWidth: 150,
                    cellStyle: { 'white-space': 'normal' },
                    autoHeight: true,
                }));
            gridApi.setColumnDefs(colDefs);
            gridApi.setRowData(rowData);
        }

        async function onCellValueChanged(params) {
            const { data, colDef, newValue, oldValue } = params;
            if (newValue === oldValue) return;
            const rowid = data.rowid;
            const campos = {};
            campos[colDef.field] = newValue;
            try {
                const resp = await fetch('/guardar_fila', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        hoja: hojaActual,
                        rowid: rowid,
                        campos: campos
                    })
                });
                const result = await resp.json();
                if (!result.ok) {
                    alert('Error al guardar: ' + (result.error || 'desconocido'));
                    params.node.setDataValue(colDef.field, oldValue);
                }
            } catch (e) {
                alert('Error de red al guardar');
                params.node.setDataValue(colDef.field, oldValue);
            }
        }

        function initGrid() {
            const gridDiv = document.getElementById('gridContainer');
            const gridOptions = {
                columnDefs: [],
                rowData: [],
                defaultColDef: {
                    editable: true,
                    sortable: true,
                    filter: true,
                    resizable: true,
                    minWidth: 100,
                },
                onCellValueChanged: onCellValueChanged,
                enableRangeSelection: true,
                enableRangeHandle: true,
                enableCellTextSelection: true,
                ensureDomOrder: true,
                suppressRowClickSelection: false,
                domLayout: 'autoHeight',
            };
            gridApi = agGrid.createGrid(gridDiv, gridOptions);
            cargarDatos();
        }

        // --- Eventos de pestañas ---
        document.getElementById('pestana_SCD').addEventListener('click', () => {
            hojaActual = 'SCD-2026';
            document.querySelectorAll('.pestana').forEach(p => p.classList.remove('activa'));
            document.getElementById('pestana_SCD').classList.add('activa');
            cargarDatos();
        });
        document.getElementById('pestana_SAF').addEventListener('click', () => {
            hojaActual = 'SAF-2026';
            document.querySelectorAll('.pestana').forEach(p => p.classList.remove('activa'));
            document.getElementById('pestana_SAF').classList.add('activa');
            cargarDatos();
        });

        // --- Botones de administración ---
        document.getElementById('btnExportar').addEventListener('click', () => {
            window.location.href = '/exportar';
        });

        document.getElementById('btnSubir').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx, .xls';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                // Mostrar indicador de carga
                const loadingMsg = document.getElementById('loadingMessage');
                const btnSubir = document.getElementById('btnSubir');
                loadingMsg.style.display = 'inline';
                btnSubir.disabled = true;
                btnSubir.textContent = '⏳ Subiendo...';
                try {
                    const formData = new FormData();
                    formData.append('archivo', file);
                    const res = await fetch('/subir_excel', { method: 'POST', body: formData });
                    const result = await res.json();
                    if (result.ok) {
                        alert('✅ Excel subido correctamente');
                        // Actualizar fecha/hora de última carga
                        const ahora = new Date();
                        document.getElementById('lastUpload').textContent = 'Última carga: ' + ahora.toLocaleString();
                        // Recargar datos
                        cargarDatos();
                    } else {
                        alert('❌ Error: ' + (result.error || 'No se pudo subir'));
                    }
                } catch (err) {
                    alert('❌ Error de red: ' + err.message);
                } finally {
                    // Ocultar indicador de carga
                    loadingMsg.style.display = 'none';
                    btnSubir.disabled = false;
                    btnSubir.textContent = '📂 Subir Excel nuevo (solo admin)';
                }
            };
            input.click();
        });

        document.getElementById('btnPausa').addEventListener('click', async () => {
            const res = await fetch('/toggle_pausa', { method: 'POST' });
            const result = await res.json();
            if (result.pausa !== undefined) {
                actualizarEstadoPausa(result.pausa);
            } else {
                alert('Error al cambiar estado');
            }
        });

        async function actualizarEstadoPausa(pausa) {
            const span = document.getElementById('estadoPausa');
            if (pausa) {
                span.innerHTML = '🔴 SISTEMA EN PAUSA - No se pueden editar';
                span.style.color = 'red';
                gridApi.setGridOption('defaultColDef', { editable: false });
            } else {
                span.innerHTML = '🟢 SISTEMA ACTIVO - Ediciones permitidas';
                span.style.color = 'green';
                gridApi.setGridOption('defaultColDef', { editable: true });
            }
        }

        // --- Inicializar ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('pestana_SCD').classList.add('activa');
            initGrid();
            actualizarEstadoPausa(false);
            // Si ya hay una carga previa, mostrar la fecha (opcional)
        });
    </script>
</body>
</html>
